spring:
  application:
    name: inventory-store
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379}
      # Configure username/password if your Redis server requires them
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
# JWT (top-level properties expected by JwtService @Value)
